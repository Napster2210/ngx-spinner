<div class="shell">
  <app-header [theme]="theme()" (themeToggle)="toggleTheme()"></app-header>

  <main class="main-grid">
    <app-type-gallery [selectedType]="config().type" (typeSelected)="onTypeSelected($event)"></app-type-gallery>

    <app-preview-stage [config]="resolvedConfig()" (toggleShow)="onToggleShow()"></app-preview-stage>

    <aside class="right-rail">
      <app-config-panel [(config)]="config"></app-config-panel>
      <app-code-panel [config]="resolvedConfig()"></app-code-panel>
    </aside>
  </main>

  <footer class="footer">
    <span>MIT License</span>
    <span class="mono">v{{ packageVersion }}</span>
    <span>Animations from Load Awesome</span>
    <span class="footer-right">
      Maintained by <a href="https://github.com/napster2210" target="_blank" rel="noopener">napster2210</a>
    </span>
  </footer>
</div>
