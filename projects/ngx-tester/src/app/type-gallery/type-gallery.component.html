<div class="panel">
  <div class="panel-head">
    <div class="panel-head-row">
      <h2 class="eyebrow">Animation type</h2>
      <span class="count mono">{{ visibleTypes().length }} / {{ total }}</span>
    </div>
    <input
      class="search"
      type="text"
      [value]="query()"
      (input)="onQueryChange($any($event.target).value)"
      [placeholder]="'Search ' + total + ' animations…'"
    />
  </div>

  <div class="scroll">
    <div class="grid">
      @for (t of visibleTypes(); track t.name) {
        <button
          type="button"
          class="tile"
          [class.selected]="t.name === selectedType()"
          (click)="select(t.name)"
        >
          <span class="icon">
            @switch (t.family) {
              @case ("dots") {
                <span class="fam-dots">
                  <i></i><i></i><i></i>
                </span>
              }
              @case ("ring") {
                <span class="fam-ring">
                  <i></i><i></i>
                </span>
              }
              @case ("spin") {
                <span class="fam-spin">
                  @for (d of [0, 1, 2, 3, 4, 5, 6, 7]; track d) {
                    <i [style.--i]="d"></i>
                  }
                </span>
              }
              @case ("grid") {
                <span class="fam-grid">
                  @for (d of [0, 1, 2, 3, 4, 5, 6, 7, 8]; track d) {
                    <i [style.--i]="d"></i>
                  }
                </span>
              }
              @case ("bars") {
                <span class="fam-bars">
                  <i></i><i></i><i></i><i></i><i></i>
                </span>
              }
              @case ("square") {
                <span class="fam-square"></span>
              }
            }
          </span>
          <span class="name mono">{{ t.name }}</span>
        </button>
      } @empty {
        <p class="empty">No animations match "{{ query() }}".</p>
      }
    </div>
  </div>
</div>
