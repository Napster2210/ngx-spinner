<div class="panel">
  <div class="panel-head">
    <div class="panel-head-row">
      <h2 class="eyebrow">Animation type</h2>
      <span class="count mono">{{ visibleTypes().length }} / {{ total }}</span>
    </div>
    <input
      class="search"
      type="text"
      [value]="query()"
      (input)="onQueryChange($any($event.target).value)"
      [placeholder]="'Search ' + total + ' animations…'"
    />
  </div>

  <div class="scroll">
    <div class="grid">
      @for (t of visibleTypes(); track t.name) {
        <button
          type="button"
          class="tile"
          [class.selected]="t.name === selectedType()"
          (click)="select(t.name)"
        >
          <span class="icon">
            <div class="spinner-icon" [class]="'la-' + t.name">
              @for (d of t.divs; track d) {
                <div></div>
              }
            </div>
          </span>
          <span class="name mono">{{ t.name }}</span>
        </button>
      } @empty {
        <p class="empty">No animations match "{{ query() }}".</p>
      }
    </div>
  </div>
</div>
